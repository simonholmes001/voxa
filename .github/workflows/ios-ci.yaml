name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "docs/api-contracts.md"
      - ".github/workflows/ios-ci.yaml"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-ci-required:
    name: iOS CI Required
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.detect.outputs.run-tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect iOS-impacting changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          )"

          if echo "$changed_files" | grep -Eq '^(ios/|docs/api-contracts\.md$|\.github/workflows/ios-ci\.yaml$)'; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
            echo "iOS tests are not required for this change set."
          fi

  swift-package-tests:
    name: iPhone/iPad Swift Tests (iOS changes)
    runs-on: macos-latest
    needs: ios-ci-required
    if: needs.ios-ci-required.outputs.run-tests == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Swift package artifacts
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ios/VoxaApp/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('ios/VoxaApp/Package.resolved') }}

      - name: Run Swift package tests
        shell: bash
        run: |
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=safe.bareRepository \
            GIT_CONFIG_VALUE_0=all \
            swift test --package-path ios/VoxaApp

  app-simulator-tests:
    name: iPhone/iPad App Simulator Tests (iOS changes)
    runs-on: macos-latest
    needs: ios-ci-required
    if: needs.ios-ci-required.outputs.run-tests == 'true'
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Swift package artifacts
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ios/VoxaApp/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('ios/VoxaApp/Package.resolved') }}

      - name: Record Xcode and simulator environment
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick an iPhone simulator device
        id: pick-iphone
        shell: bash
        run: |
          udid="$(
            xcrun simctl list devices available -j \
              | jq -r --arg pat '^iPhone' \
                  '.devices | to_entries[] | .value[]
                   | select(.name | test($pat))
                   | .udid' \
              | head -n1
          )"
          if [ -z "${udid}" ]; then
            echo "::error::No available iPhone simulator on this runner image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Run app target tests on iPhone Simulator
        shell: bash
        run: |
          derived_data_path="${RUNNER_TEMP}/voxa-derived-data"
          echo "Using iPhone simulator UDID: ${{ steps.pick-iphone.outputs.udid }}"
          echo "Using shared DerivedData path: ${derived_data_path}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=safe.bareRepository \
            GIT_CONFIG_VALUE_0=all \
            xcodebuild test \
              -project ios/Voxa.xcodeproj \
              -scheme Voxa \
              -destination "id=${{ steps.pick-iphone.outputs.udid }}" \
              -derivedDataPath "${derived_data_path}" \
              -resultBundlePath "${RUNNER_TEMP}/voxa-iphone.xcresult" \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

      - name: Pick an iPad simulator device
        id: pick-ipad
        shell: bash
        run: |
          udid="$(
            xcrun simctl list devices available -j \
              | jq -r --arg pat '^iPad' \
                  '.devices | to_entries[] | .value[]
                   | select(.name | test($pat))
                   | .udid' \
              | head -n1
          )"
          if [ -z "${udid}" ]; then
            echo "::error::No available iPad simulator on this runner image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Run app target tests on iPad Simulator
        shell: bash
        run: |
          echo "Using iPad simulator UDID: ${{ steps.pick-ipad.outputs.udid }}"
          echo "Reusing DerivedData path: ${RUNNER_TEMP}/voxa-derived-data"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=safe.bareRepository \
            GIT_CONFIG_VALUE_0=all \
            xcodebuild test-without-building \
              -project ios/Voxa.xcodeproj \
              -scheme Voxa \
              -destination "id=${{ steps.pick-ipad.outputs.udid }}" \
              -derivedDataPath "${RUNNER_TEMP}/voxa-derived-data" \
              -resultBundlePath "${RUNNER_TEMP}/voxa-ipad.xcresult" \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-diagnostics
          path: |
            ${{ runner.temp }}/voxa-iphone.xcresult
            ${{ runner.temp }}/voxa-ipad.xcresult
          if-no-files-found: warn
