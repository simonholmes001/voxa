name: iOS TestFlight

# Trigger model:
#
# 1. **Tag push** — a merge to main triggers `.github/workflows/release.yml`,
#    which consumes any pending `.changeset/*.md` files and pushes a
#    `v<semver>` tag. That tag push triggers this workflow, which builds
#    and uploads a TestFlight build with MARKETING_VERSION derived from
#    the tag and CURRENT_PROJECT_VERSION derived from the run number
#    (monotonic — guarantees a unique CFBundleVersion per upload).
#
# 2. **Manual dispatch** — for re-uploads, hotfix rebuilds, or the very
#    first upload before the first tag exists. Optionally accepts a
#    marketing_version input; if omitted, the newest `v*` tag is used.
#
# No push-to-main trigger: it would race with `release.yml` (the tag it
# creates would not yet exist when the upload starts) and would upload
# a build even when there was nothing releasable.

on:
  # Auto-trigger: fires when the Release workflow completes on main.
  # Release creates and pushes the v<semver> tag via GITHUB_TOKEN,
  # which GitHub deliberately does NOT let trigger downstream
  # workflows via the tag-push event (loop prevention). workflow_run
  # is exempt from that rule: it triggers on the completion of a
  # named workflow, regardless of what token the initiator used.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  # Manual dispatch: for re-uploads, hotfix rebuilds, or the very
  # first upload before the first v* tag exists.
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 0.20.0). Leave blank to use the newest v* tag."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  upload-testflight:
    name: Upload Internal TestFlight Build
    runs-on: macos-latest
    # Skip when workflow_run fires but Release did not actually
    # succeed (e.g. Release ran but no changesets were present, or
    # the tag step failed). Manual dispatch always runs.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so we can resolve the newest v* tag on
          # workflow_dispatch when the caller does not supply one.
          fetch-depth: 0

      - name: Detect iOS project
        id: detect
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          VOXA_XCODE_SCHEME: ${{ secrets.VOXA_XCODE_SCHEME }}
        run: |
          if ! { [ -d ios ] && find ios -maxdepth 3 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print -quit | grep -q .; }; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Xcode project/workspace exists yet; TestFlight upload is skipped."
            exit 0
          fi
          if [ -z "${APP_STORE_CONNECT_API_KEY_BASE64:-}" ] || [ -z "${VOXA_XCODE_SCHEME:-}" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Xcode project exists but TestFlight signing secrets are not configured; upload is skipped."
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Resolve marketing version
        id: version
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_run)
              # Release just finished on main; fetch the newest v* tag
              # it pushed. checkout used fetch-depth: 0 so the tag is
              # already local.
              tag="$(git tag --list 'v*' --sort=-version:refname | head -n1 || true)"
              if [ -z "$tag" ]; then
                echo "workflow_run: no v* tag found after Release completion." >&2
                exit 1
              fi
              version="${tag#v}"
              ;;
            workflow_dispatch)
              supplied="${{ github.event.inputs.marketing_version }}"
              if [ -n "$supplied" ]; then
                version="$supplied"
              else
                tag="$(git tag --list 'v*' --sort=-version:refname | head -n1 || true)"
                if [ -z "$tag" ]; then
                  echo "No v* tag found and no marketing_version input provided." >&2
                  exit 1
                fi
                version="${tag#v}"
              fi
              ;;
            *)
              echo "Unexpected event: ${{ github.event_name }}" >&2
              exit 1
              ;;
          esac
          echo "marketing_version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved marketing version: $version"

      - name: Validate required secrets
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        env:
          VOXA_APP_IDENTIFIER: ${{ secrets.VOXA_APP_IDENTIFIER }}
          VOXA_APPLE_ID: ${{ secrets.VOXA_APPLE_ID }}
          VOXA_ITC_TEAM_ID: ${{ secrets.VOXA_ITC_TEAM_ID }}
          VOXA_TEAM_ID: ${{ secrets.VOXA_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          VOXA_XCODE_PROJECT: ${{ secrets.VOXA_XCODE_PROJECT }}
          VOXA_XCODE_WORKSPACE: ${{ secrets.VOXA_XCODE_WORKSPACE }}
          VOXA_XCODE_SCHEME: ${{ secrets.VOXA_XCODE_SCHEME }}
        run: |
          required=(
            VOXA_APP_IDENTIFIER
            VOXA_APPLE_ID
            VOXA_ITC_TEAM_ID
            VOXA_TEAM_ID
            MATCH_GIT_URL
            MATCH_PASSWORD
            MATCH_KEYCHAIN_PASSWORD
            MATCH_GIT_BASIC_AUTHORIZATION
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_API_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64
            VOXA_XCODE_SCHEME
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done
          if [ -n "${VOXA_XCODE_PROJECT:-}" ] && [ -n "${VOXA_XCODE_WORKSPACE:-}" ]; then
            echo "Set only one of VOXA_XCODE_PROJECT or VOXA_XCODE_WORKSPACE" >&2
            exit 1
          fi
          if [ -z "${VOXA_XCODE_PROJECT:-}" ] && [ -z "${VOXA_XCODE_WORKSPACE:-}" ]; then
            echo "Either VOXA_XCODE_PROJECT or VOXA_XCODE_WORKSPACE is required" >&2
            exit 1
          fi

      - name: Decode App Store Connect API key
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          umask 077
          key_path="$(mktemp /tmp/voxa-authkey.XXXXXX.p8)"
          echo "${APP_STORE_CONNECT_API_KEY_BASE64}" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Setup Ruby
        if: steps.detect.outputs.exists == 'true'
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6
        with:
          ruby-version: "3.1"
          bundler: "2.5.23"
          bundler-cache: true
          working-directory: ios

      - name: Validate iOS project, scheme, and privacy manifest
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        # Run from ios/ so VOXA_XCODE_PROJECT (e.g. "Voxa.xcodeproj")
        # resolves the same way here as it does for the fastlane upload
        # step below. The script's default MANIFEST_PATH and
        # INFO_PLIST_PATH are ios-relative to match.
        working-directory: ios
        env:
          VOXA_XCODE_PROJECT: ${{ secrets.VOXA_XCODE_PROJECT }}
          VOXA_XCODE_WORKSPACE: ${{ secrets.VOXA_XCODE_WORKSPACE }}
          VOXA_XCODE_SCHEME: ${{ secrets.VOXA_XCODE_SCHEME }}
        run: bash ../.github/scripts/validate-ios-project.sh

      - name: Upload internal TestFlight build
        if: steps.detect.outputs.exists == 'true'
        working-directory: ios
        env:
          VOXA_APP_IDENTIFIER: ${{ secrets.VOXA_APP_IDENTIFIER }}
          VOXA_APPLE_ID: ${{ secrets.VOXA_APPLE_ID }}
          VOXA_ITC_TEAM_ID: ${{ secrets.VOXA_ITC_TEAM_ID }}
          VOXA_TEAM_ID: ${{ secrets.VOXA_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          VOXA_XCODE_PROJECT: ${{ secrets.VOXA_XCODE_PROJECT }}
          VOXA_XCODE_WORKSPACE: ${{ secrets.VOXA_XCODE_WORKSPACE }}
          VOXA_XCODE_SCHEME: ${{ secrets.VOXA_XCODE_SCHEME }}
          VOXA_BUILD_NUMBER: ${{ github.run_number }}
          VOXA_MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: bundle exec fastlane ios upload_internal_testflight

      - name: Cleanup App Store Connect API key
        if: always()
        shell: bash
        run: rm -f "${APP_STORE_CONNECT_API_KEY_PATH:-}"
