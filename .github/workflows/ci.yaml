name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**", "docs/**", "refactor/**", "test/**", "ci/**"]
  pull_request:
    branches: [main]

jobs:
  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require changeset for releasable changes
        shell: bash
        run: bash .github/scripts/changeset-check.sh

  repository-script-tests:
    name: Repository Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Run repository script tests
        shell: bash
        run: |
          node --test .github/scripts/*.test.mjs
          bash .github/scripts/compute-next-release.test.sh
          bash .github/scripts/changeset-check.test.sh

  node-tests:
    name: Node Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [".", "functions/voxa-api"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect Node project
        id: detect
        shell: bash
        run: |
          if [ -f "${{ matrix.dir }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Node project in ${{ matrix.dir }}; skipping."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --workspaces=false
          else
            npm install
          fi

      - name: Run Node tests
        if: steps.detect.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          if npm run | grep -q " test"; then
            npm run test
          else
            echo "No test script found; skipping."
          fi

  dotnet-tests:
    name: .NET Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect .NET solution
        id: detect
        shell: bash
        run: |
          if compgen -G "backend/*.sln" > /dev/null || compgen -G "*.sln" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No .NET solution found; skipping."
          fi

      - name: Setup .NET
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run .NET tests
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          if compgen -G "backend/*.sln" > /dev/null; then
            dotnet test backend/*.sln --verbosity minimal
          else
            dotnet test *.sln --verbosity minimal
          fi

  ios-swift-tests:
    name: iPhone/iPad Swift Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect Swift package
        id: detect
        shell: bash
        run: |
          if [ -f "ios/VoxaApp/Package.swift" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Voxa iOS/iPadOS Swift package found; skipping."
          fi

      - name: Run Swift package tests
        if: steps.detect.outputs.exists == 'true'
        run: swift test --package-path ios/VoxaApp
