name: Azure Infrastructure Deploy

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "backend/**"
      - "functions/**"
      - ".github/workflows/infrastructure-deploy-dev.yaml"
      - ".github/workflows/infrastructure-validate.yaml"
      - ".github/workflows/iac-lint.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: voxa-infrastructure-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_NETWORK_RESOURCE_GROUP: ${{ secrets.AZURE_NETWORK_RESOURCE_GROUP }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APP_SESSION_SIGNING_KEY: ${{ secrets.APP_SESSION_SIGNING_KEY }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect Voxa infrastructure
        id: detect
        shell: bash
        run: |
          if [ -f infrastructure/bicep/main.bicep ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "infrastructure/bicep/main.bicep is not present; deployment is skipped."
          fi

      - name: Run infrastructure guard tests
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: bash ./infrastructure/scripts/guard-tests.sh

      - name: Verify Azure OIDC configuration
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_LOCATION AZURE_RESOURCE_GROUP AZURE_NETWORK_RESOURCE_GROUP OPENAI_API_KEY APP_SESSION_SIGNING_KEY APPLE_CLIENT_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured as a repository secret."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Run ./scripts/setup-azure-auth-for-pipeline.sh dev, then copy its outputs into repository secrets."
            exit 1
          fi

      - name: Login to Azure (OIDC)
        if: steps.detect.outputs.exists == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Deploy infrastructure
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: bash ./infrastructure/scripts/deploy.sh dev

      - name: Detect deployable Function app package
        if: steps.detect.outputs.exists == 'true'
        id: function-code
        shell: bash
        run: |
          if [ -f backend/src/Voxa.Api/Voxa.Api.csproj ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No backend/src/Voxa.Api project exists yet; infrastructure-only deployment completed."
          fi

      - name: Publish Function code
        if: steps.detect.outputs.exists == 'true' && steps.function-code.outputs.exists == 'true'
        shell: bash
        run: |
          publish_dir="${RUNNER_TEMP}/voxa-api-publish"
          package_path="${RUNNER_TEMP}/released-package.zip"
          function_app_name="$(
            az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name main \
              --query "properties.outputs.functionAppName.value" \
              --output tsv
          )"
          deployment_storage_account_name="$(
            az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name main \
              --query "properties.outputs.deploymentStorageAccountName.value" \
              --output tsv
          )"
          function_identity_resource_id="$(
            az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name main \
              --query "properties.outputs.functionAppManagedIdentityResourceId.value" \
              --output tsv
          )"

          if [ -z "$function_app_name" ]; then
            echo "::error::Function App name was not found in the main deployment outputs."
            exit 1
          fi
          if [ -z "$deployment_storage_account_name" ]; then
            echo "::error::Deployment artifact storage account name was not found in the main deployment outputs."
            exit 1
          fi
          if [ -z "$function_identity_resource_id" ]; then
            echo "::error::Function App managed identity resource ID was not found in the main deployment outputs."
            exit 1
          fi

          dotnet publish backend/src/Voxa.Api/Voxa.Api.csproj \
            --configuration Release \
            --output "$publish_dir"
          (cd "$publish_dir" && zip -qr "$package_path" .)

          az functionapp deployment config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$function_app_name" \
            --deployment-storage-name "$deployment_storage_account_name" \
            --deployment-storage-container-name "function-releases" \
            --deployment-storage-auth-type UserAssignedIdentity \
            --deployment-storage-auth-value "$function_identity_resource_id"

          set +e
          deployment_output="$(
            az functionapp deployment source config-zip \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$function_app_name" \
              --src "$package_path" 2>&1
          )"
          deployment_status="$?"
          set -e
          printf '%s\n' "$deployment_output"

          if [ "$deployment_status" -ne 0 ]; then
            if printf '%s\n' "$deployment_output" | grep -q "Failed to fetch host key to check for function app status"; then
              echo "::warning::Function package upload was accepted, but Azure CLI failed its post-upload host-key health check."
              function_count="$(
                az functionapp function list \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$function_app_name" \
                  --query "length(@)" \
                  --output tsv
              )"
              if [ "${function_count:-0}" -gt 0 ]; then
                echo "::notice::Function App reports $function_count deployed functions after package upload."
              else
                echo "::error::Function App did not report deployed functions after the host-key check failure."
                exit "$deployment_status"
              fi
            else
              exit "$deployment_status"
            fi
          fi

          az functionapp function list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$function_app_name" \
            --query "[].name" \
            --output table
