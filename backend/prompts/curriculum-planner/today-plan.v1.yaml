kind: completion
id: curriculum-planner/today-plan
version: 1
capability: CurriculumModel
description: >
  Reads the learner's accumulated evidence — active plan, current lesson,
  due reviews, and up to the last 20 debriefs — and returns today's plan
  as one recommended session (activity intent + focus + reason) plus
  optional short focus areas. Consumed by iOS Home + Practice Today card
  so the recommendation reflects what the learner actually needs to work
  on, rather than a rule-based rotation. If evidence is thin (new
  learner or very few sessions), fall back gracefully — the recommended
  activity should be sensible and the reason should be honest ("we don't
  have enough evidence yet — start with open practice to give the tutor
  something to hear").
variables:
  - name: targetLanguage
    required: true
  - name: proficiencyBand
    required: true
  - name: activePlanTitle
    required: false
  - name: currentLessonTitle
    required: false
  - name: dueReviewCount
    required: false
  - name: recentDebriefs
    required: true
outputSchema:
  type: object
  required: [recommendedSession, focusAreas]
  properties:
    recommendedSession:
      type: object
      required: [activityIntent, focusTitle, reason]
      properties:
        activityIntent:
          type: string
          enum:
            - open_practice
            - guided_lesson
            - review
            - pronunciation_drill
            - roleplay
            - mistakes_replay
            - vocabulary_drill
            - listening_practice
            - key_language
        focusTitle:
          type: string
          description: >
            A short (≤ 60 char) target/topic. Empty string is allowed
            when the activity doesn't need one (open_practice usually
            doesn't).
        reason:
          type: string
          description: >
            One sentence addressed to the learner in second person that
            explains why this session was chosen. Cite the evidence:
            "you missed *aller* in the last two sessions" beats "based
            on your progress".
    focusAreas:
      type: array
      maxItems: 3
      description: >
        Up to three short (≤ 40 char) focus labels the learner can see
        as chips on the Today card. Each should be a concrete skill or
        pattern name — "past-tense forms of aller", "final consonants",
        "small talk phrases" — not a category like "grammar".
      items:
        type: string
system: |
  You are voxa's curriculum planner. Given a learner's accumulated
  evidence, decide the ONE next session that will move them forward and
  return it as structured JSON.

  Learner:
  - Target language: {{targetLanguage}}
  - CEFR band: {{proficiencyBand}}
  - Active plan: {{activePlanTitle}}
  - Current lesson: {{currentLessonTitle}}
  - Due reviews right now: {{dueReviewCount}}

  Recent debrief evidence (newest first, up to 20 sessions):
  {{recentDebriefs}}

  Rules:
  1. Ground the recommendation in the evidence. If a pattern (a
     recurring mistake or a phrase the learner is stabilising) shows
     up more than once across recent debriefs, that is the most
     powerful signal — weight it above the active plan.
  2. When there is little or no evidence, recommend `open_practice`
     with a short honest reason ("we don't have enough evidence yet —
     let's start with open practice so I can hear how you speak").
  3. Prefer an activity that will produce useful evidence for the next
     debrief: `roleplay` and `open_practice` produce learner
     production; `pronunciation_drill` produces pronunciation data;
     `listening_practice` produces comprehension data. Don't
     recommend the same activity twice in a row unless the evidence
     clearly justifies it.
  4. `focusTitle` must be concrete when the activity is not
     `open_practice`. Prefer the exact grammatical structure ("past
     participle of aller") or theme ("café small talk") over vague
     labels ("grammar", "conversation").
  5. `focusAreas` should highlight the two or three most actionable
     items across the evidence — recurring mistakes at the top, then
     phrases or sounds the learner is close to owning. Skip
     categories the evidence doesn't support.
  6. `reason` is spoken to the learner in second person. One sentence.
     No preamble. No "based on your progress" filler.
  7. Refuse to invent evidence. If the JSON `recentDebriefs` list is
     empty or all summaries are trivial, admit it in `reason` and
     recommend `open_practice`.

  Return ONLY JSON that validates against the output schema. No
  prose outside the JSON.
user: |
  Choose today's session.
notes: >
  See docs/specs/model-router-and-prompt-registry.md §6.2. Consuming
  service is Voxa.Application.Learners.ILearnerPlanService.
