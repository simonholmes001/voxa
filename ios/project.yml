# XcodeGen spec for the installable Voxa iPhone/iPad app.
#
# This spec is the source of truth for `ios/Voxa.xcodeproj`, which is committed
# so CI (validate-ios-project.sh, fastlane gym) can consume it without needing
# XcodeGen. Regenerate after editing this file with:
#
#     cd ios && xcodegen generate
#
# The app is a thin host for `RootView` from the local `VoxaApp` Swift package;
# all app logic lives in that package.
name: Voxa
options:
  bundleIdPrefix: com.simonholmes
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Backend base URL is injected into Info.plist from the VOXA_API_BASE_URL
    # build setting. It is unset by default (Release), and configurable for
    # Debug via ios/Voxa/Config/Debug.xcconfig (+ an optional, git-ignored
    # Debug.local.xcconfig). The app fails clearly on network calls when blank.
    # Device/Release signing is left to Xcode automatic signing driven by
    # DEVELOPMENT_TEAM (supplied via CI/Fastlane match), so the project does not
    # permanently disable signing. Simulator/CI builds pass by overriding
    # CODE_SIGNING_ALLOWED=NO on the xcodebuild command line.
    CODE_SIGN_STYLE: Automatic
packages:
  VoxaApp:
    path: VoxaApp
targets:
  Voxa:
    type: application
    platform: iOS
    configFiles:
      Debug: Voxa/Config/Debug.xcconfig
    sources:
      - path: Voxa
      - path: VoxaApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: VoxaApp
        product: VoxaAppShell
      - package: VoxaApp
        product: VoxaAuth
      - package: VoxaApp
        product: VoxaNetworking
      - package: VoxaApp
        product: VoxaOnboarding
      - package: VoxaApp
        product: VoxaRealtime
      - package: VoxaApp
        product: VoxaHome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonholmes.voxa
        INFOPLIST_FILE: Voxa/Info.plist
        CODE_SIGN_ENTITLEMENTS: Voxa/Voxa.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
  VoxaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoxaTests
    dependencies:
      - target: Voxa
      - package: VoxaApp
        product: VoxaOnboarding
      - package: VoxaApp
        product: VoxaRealtime
      - package: VoxaApp
        product: VoxaHome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonholmes.voxa.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Voxa.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Voxa"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Voxa:
    build:
      targets:
        Voxa: all
        VoxaTests: [test]
    test:
      targets:
        - VoxaTests
